spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/minibank_db
        username: postgres
        password: ${MINIBANK_DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                format_sql: false

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1

server:
    port: 8080

logging:
    pattern:
        console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level --- [%thread] [requestId=%X{requestId:-NO_REQUEST_ID}] %logger{36} : %msg%n%ex"
    level:
        root: INFO
        org.hibernate.SQL: WARN
        org.hibernate.orm.jdbc.bind: WARN
