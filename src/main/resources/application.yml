spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/minibank_db
        username: postgres
        password: ${MINIBANK_DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1

server:
    port: 8080
